# Installed TAP integration, based on m3dp/voron/printer.cfg.
# Keep the existing [safe_z_home]; do not add [homing_override]. Include this
# after the original KNOMI macros: these bodies retain its status flags.
# T0 is the only reference nozzle permitted to home or probe the bed.

[gcode_macro _CX_TAP_CONFIG]
# Verify that the assembled CxChanger retains TAP travel, switch operation and
# stable nozzle seating under the probing force before permitting Z homing.
variable_mount_verified: False
gcode:

# Replace the existing [probe] definition with this block, keeping its measured
# Z offset only until T0 is recalibrated. No new z_offset is invented here; the
# existing SAVE_CONFIG probe value supplies it. Re-run PROBE_CALIBRATE with T0
# after the head is assembled, then regenerate the bed mesh.
[probe]
pin: !EBBCan:gpio22
x_offset: 0
y_offset: 0
speed: 10
samples: 3
samples_result: median
sample_retract_dist: 5.0
samples_tolerance: 0.008
samples_tolerance_retries: 3
activate_gcode:
    CX_TAP_PREPARE

[gcode_macro _CX_REQUIRE_TAP_TOOL]
gcode:
    {% set state = printer["gcode_macro _CX_STATE"] %}
    {% if not printer["gcode_macro _CX_TAP_CONFIG"].mount_verified %}
        {action_raise_error("Verify the installed TAP mounting, switch and CxChanger nozzle seating before enabling mount_verified.")}
    {% endif %}
    {% if state.current_tool|int != 0 or state.faulted or state.busy %}
        {action_raise_error("TAP requires physically mounted and confirmed T0. Do not home or probe with an empty head or another tool.")}
    {% endif %}
    {% if printer.toolhead.extruder != "extruder" %}
        {action_raise_error("TAP reference heater must be T0; reconcile the mounted tool with CX_CONFIRM_TOOL TOOL=0.")}
    {% endif %}
    {% if not printer["filament_switch_sensor cx_tool_sensor"].filament_detected %}
        {action_raise_error("TAP reference T0 is not detected. Inspect the hotend seating and filament before probing.")}
    {% endif %}

[gcode_macro CX_TAP_PREPARE]
description: Verify reference T0 and enforce the installed TAP probing temperature
gcode:
    M400
    G4 P{printer["gcode_macro _CX_CONFIG"].settle_ms}
    _CX_REQUIRE_TAP_TOOL
    _CX_TAP_COOL
    # Recheck the physical state after a potentially long temperature wait.
    _CX_REQUIRE_TAP_TOOL

[gcode_macro _CX_TAP_COOL]
gcode:
    {% if printer.extruder.target|float > 150 %}
        M109 T0 S150
    {% elif printer.extruder.temperature|float > 155 %}
        TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=155
    {% endif %}

# G28 is a traditional G-code; Klipper requires its renamed command to be
# traditional as well. G9928 retains the existing safe_z_home implementation.
[gcode_macro G28]
rename_existing: G9928
gcode:
    {% if "Z" in params or ("X" not in params and "Y" not in params) %}
        CX_TAP_PREPARE
    {% endif %}
    {% if "gcode_macro _KNOMI_STATUS" in printer %}
        SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=True
    {% endif %}
    G9928 {rawparams}
    {% if "gcode_macro _KNOMI_STATUS" in printer %}
        SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=False
    {% endif %}

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: CX_BASE_QUAD_GANTRY_LEVEL
gcode:
    CX_TAP_PREPARE
    {% if "gcode_macro _KNOMI_STATUS" in printer %}
        SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=qgling VALUE=True
    {% endif %}
    CX_BASE_QUAD_GANTRY_LEVEL {rawparams}
    {% if "gcode_macro _KNOMI_STATUS" in printer %}
        SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=qgling VALUE=False
    {% endif %}

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: CX_BASE_BED_MESH_CALIBRATE
gcode:
    CX_TAP_PREPARE
    {% if "gcode_macro _KNOMI_STATUS" in printer %}
        SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=probing VALUE=True
    {% endif %}
    CX_BASE_BED_MESH_CALIBRATE {rawparams}
    {% if "gcode_macro _KNOMI_STATUS" in printer %}
        SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=probing VALUE=False
    {% endif %}
