# CxChanger six-tool print lifecycle. Included after toolchange.cfg.
# Replace existing macros with these definitions; do not include both versions.

[gcode_macro _CX_PRINT_CONFIG]
# Measure a clear priming strip on the installed printer before commissioning.
variable_prime_x: 10.0
variable_prime_y: 5.0
variable_prime_spacing: 2.0
variable_prime_length: 50.0
variable_prime_z: 0.28
gcode:

[gcode_macro PRINT_START]
description: Home and probe with reference T0 on TAP, then dock, heat and prime used tools
gcode:
    {% set cfg = printer["gcode_macro _CX_PRINT_CONFIG"] %}
    {% set state = printer["gcode_macro _CX_STATE"] %}
    {% set first_raw = params.INITIAL_TOOL|default('0')|string %}
    {% set first = first_raw|int %}
    {% set bed = params.BED|default(60)|float %}
    {% set ns = namespace(tools=[], temps=[]) %}
    {% if first_raw not in ['0', '1', '2', '3', '4', '5'] %}
        {action_raise_error("INITIAL_TOOL must be 0 through 5")}
    {% endif %}
    {% if state.current_tool|int != 0 or state.faulted or state.busy %}
        {action_raise_error("Start with T0 physically mounted and CX_CONFIRM_TOOL TOOL=0; TAP needs its reference nozzle for homing")}
    {% endif %}
    {% if bed != bed or bed <= 0 or bed >= printer.configfile.settings.heater_bed.max_temp|float %}
        {action_raise_error("BED must be above zero and below the configured bed limit")}
    {% endif %}
    {% for t in range(6) %}
        {% set key = 'T' ~ t ~ '_TEMP' %}
        {% set used = params['T' ~ t ~ '_USED']|default('0')|string|lower %}
        {% if used not in ['0', '1', 'false', 'true'] %}
            {action_raise_error("Tool USED flags must be 0/1 or false/true")}
        {% endif %}
        {% if used in ['1', 'true'] %}
            {% set heater = 'extruder' if t == 0 else 'extruder' ~ t %}
            {% if key not in params or heater not in printer %}
                {action_raise_error("Every used tool needs a configured heater and Tn_TEMP")}
            {% endif %}
            {% set temp = params[key]|float %}
            {% set limits = printer.configfile.settings[heater] %}
            {% if temp != temp or temp < limits.min_extrude_temp|float or temp >= limits.max_temp|float %}
                {action_raise_error("T" ~ t ~ " temperature is outside its extrusion/temperature limits")}
            {% endif %}
            {% if t != 0 %}
                {% for axis in ['x', 'y', 'z'] %}
                    {% if ('t' ~ t ~ '_offset_' ~ axis) not in printer.save_variables.variables %}
                        {action_raise_error("Calibrate T" ~ t ~ " offsets before printing")}
                    {% endif %}
                {% endfor %}
            {% endif %}
            {% set ns.tools = ns.tools + [t] %}
            {% set ns.temps = ns.temps + [temp] %}
        {% endif %}
    {% endfor %}
    {% if first not in ns.tools %}
        {action_raise_error("INITIAL_TOOL must be marked used with a valid temperature")}
    {% endif %}
    {% set lo = printer.toolhead.axis_minimum %}
    {% set hi = printer.toolhead.axis_maximum %}
    {% set last_y = cfg.prime_y + (ns.tools|length - 1) * cfg.prime_spacing %}
    {% if cfg.prime_length <= 0 or cfg.prime_spacing <= 0 or cfg.prime_z <= 0 or cfg.prime_z > hi.z
          or cfg.prime_x < lo.x or cfg.prime_x + cfg.prime_length > hi.x
          or cfg.prime_y < lo.y or last_y > hi.y %}
        {action_raise_error("Priming strip is outside configured travel; measure it before commissioning")}
    {% endif %}
    CX_ASSERT_READY HOMED=0
    M400
    G4 P{printer["gcode_macro _CX_CONFIG"].settle_ms}
    _CX_CHECK_CURRENT_TOOL
    CX_TAP_PREPARE
    G90
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
    BED_MESH_CLEAR
    M140 S{bed}
    M190 S{bed}
    G28
    QUAD_GANTRY_LEVEL
    G28 Z
    BED_MESH_CALIBRATE
    # Probing is complete. Heat parked hotends so their dock pads catch ooze.
    UNTOOL
    {% if 0 not in ns.tools %}
        M104 T0 S0
    {% endif %}
    {% for t in ns.tools %}
        M104 T{t} S{ns.temps[loop.index0]}
    {% endfor %}
    {% for t in ns.tools %}
        M109 T{t} S{ns.temps[loop.index0]}
    {% endfor %}
    SAVE_GCODE_STATE NAME=cx_start
    {% set line = namespace(index=0) %}
    {% for t in ns.tools if t != first %}
        _CX_PRIME TOOL={t} LINE={line.index}
        M104 T{t} S0
        {% set line.index = line.index + 1 %}
    {% endfor %}
    _CX_PRIME TOOL={first} LINE={line.index}
    # Keep the selected tool's offsets while restoring the caller's modes/E.
    _CX_FINISH_START

[gcode_macro _CX_PRIME]
gcode:
    {% set t = params.TOOL|int %}
    {% set line = params.LINE|int %}
    {% set cfg = printer["gcode_macro _CX_PRINT_CONFIG"] %}
    T{t}
    G90
    G1 Z5 F600
    G1 X{cfg.prime_x} Y{cfg.prime_y + line * cfg.prime_spacing} F6000
    G1 Z{cfg.prime_z} F600
    M83
    G1 E3 F300
    G1 X{cfg.prime_x + cfg.prime_length} E{cfg.prime_length * 0.12} F1000
    G1 Z5 F600

[gcode_macro _CX_FINISH_START]
gcode:
    {% set offset = printer.gcode_move.homing_origin %}
    RESTORE_GCODE_STATE NAME=cx_start MOVE=0
    SET_GCODE_OFFSET X={offset.x} Y={offset.y} Z={offset.z} MOVE=0
    {action_respond_info("CxChanger priming complete")}

[gcode_macro PRINT_END]
description: Shut down heating and park the hotend without crossing the finished print
gcode:
    # This executes even if docking later fails.
    TURN_OFF_HEATERS
    M107
    UNTOOL
    M400
    BED_MESH_CLEAR
    # UNTOOL leaves the empty carriage at the measured dock exit, at its lifted Z.
    # Do not descend to a fixed parking height or traverse the completed part.

[gcode_macro PAUSE]
rename_existing: CX_BASE_PAUSE
gcode:
    {% if not printer.pause_resume.is_paused %}
        CX_BASE_PAUSE
        {% if 'xyz' in printer.toolhead.homed_axes %}
            {% set lift = [5.0, printer.toolhead.axis_maximum.z - printer.toolhead.position.z]|min %}
            {% if lift > 0 %}
                SAVE_GCODE_STATE NAME=cx_pause_lift
                G91
                G1 Z{lift} F600
                RESTORE_GCODE_STATE NAME=cx_pause_lift MOVE=0
            {% endif %}
        {% endif %}
    {% endif %}

[gcode_macro RESUME]
rename_existing: CX_BASE_RESUME
gcode:
    {% set state = printer["gcode_macro _CX_STATE"] %}
    {% if state.faulted or state.busy or state.current_tool|int < 0 %}
        {action_raise_error("Tool state is uncertain: cancel, recover, and restart instead of resuming")}
    {% endif %}
    {% if not printer['filament_switch_sensor cx_tool_sensor'].filament_detected %}
        {action_raise_error("Check the mounted tool and filament before resuming")}
    {% endif %}
    {% if not printer[printer.toolhead.extruder].can_extrude %}
        {action_raise_error("Heat the mounted tool before resuming")}
    {% endif %}
    CX_ASSERT_READY
    CX_BASE_RESUME {rawparams}

[gcode_macro CANCEL_PRINT]
rename_existing: CX_BASE_CANCEL_PRINT
gcode:
    TURN_OFF_HEATERS
    M107
    SET_FILAMENT_SENSOR SENSOR=cx_tool_sensor ENABLE=0
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=
    # Clear Mainsail's layer-pause requests so a cancelled job cannot pause the
    # next job unexpectedly. These helpers exist in the supplied include tree.
    {% if "gcode_macro SET_PAUSE_NEXT_LAYER" in printer %}
        SET_PAUSE_NEXT_LAYER ENABLE=0
    {% endif %}
    {% if "gcode_macro SET_PAUSE_AT_LAYER" in printer %}
        SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
    {% endif %}
    {% if "gcode_macro _KNOMI_STATUS" in printer %}
        {% for flag in ["homing", "probing", "qgling", "heating_nozzle", "heating_bed"] %}
            SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE={flag} VALUE=False
        {% endfor %}
    {% endif %}
    CX_BASE_CANCEL_PRINT
    # No automatic docking: cancel may follow a failed pickup or lost homing.
    # Reconcile the physical state with CX_CONFIRM_TOOL before starting again.
    SET_GCODE_VARIABLE MACRO=_CX_STATE VARIABLE=current_tool VALUE=-2
    SET_GCODE_VARIABLE MACRO=_CX_STATE VARIABLE=busy VALUE=False
