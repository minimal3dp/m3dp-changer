# Six-tool CxChanger macros for a Voron 2.4 with docks on the moving gantry.
# Keep the working Voron motion/homing configuration. Read README before enabling.
# Root config supplies save_variables, pause_resume, and cx_tool_sensor.
# Sensor filament_detected=True must mean a loaded head with filament present.

[gcode_macro _CX_CONFIG]
variable_commissioned: False
# Measured front-dock coordinates; None deliberately prevents motion.
variable_docks: {0: [None, None], 1: [None, None], 2: [None, None], 3: [None, None], 4: [None, None], 5: [None, None]}
variable_dock_shift_x: -3.0
variable_dock_dodge_y: 14.0
variable_dock_safe_y: 30.0
variable_z_hop: 2.0
variable_travel_speed: 100.0
variable_dock_speed: 10.0
variable_z_speed: 10.0
variable_accel: 1000.0
variable_settle_ms: 250
gcode:

[gcode_macro _CX_STATE]
# -2 = unknown; -1 = empty; 0..5 = manually confirmed or verified pickup.
variable_current_tool: -2
variable_faulted: False
variable_busy: False
variable_return_enabled: False
variable_return_position: [0.0, 0.0, 0.0]
variable_new_offset: [0.0, 0.0, 0.0]
variable_applied_tool_offset: [0.0, 0.0, 0.0]
variable_new_tool_offset: [0.0, 0.0, 0.0]
variable_saved_accel: 1000.0
gcode:

[delayed_gcode CX_BOOT]
initial_duration: 0.1
gcode:
    SET_FILAMENT_SENSOR SENSOR=cx_tool_sensor ENABLE=0
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=
    {action_respond_info("CxChanger state is unknown. Inspect the head, then CX_CONFIRM_TOOL TOOL=-1 or TOOL=0..5 before homing or changing tools.")}

[gcode_macro CX_ASSERT_READY]
description: Check commissioning and known state; HOMED=0 allows pre-homing checks
gcode:
    {% set cfg = printer["gcode_macro _CX_CONFIG"] %}
    {% set state = printer["gcode_macro _CX_STATE"] %}
    {% if not cfg.commissioned %}
        {action_raise_error("CxChanger is not commissioned: verify wiring, sensor, gantry docks, travel limits and coordinates before setting commissioned=True.")}
    {% endif %}
    {% if state.faulted or state.busy or state.current_tool|int < -1 %}
        {action_raise_error("CxChanger state is uncertain. Cancel any paused print, inspect the head and docks, then CX_CONFIRM_TOOL.")}
    {% endif %}
    {% if params.HOMED|default(1)|int and printer.toolhead.homed_axes != "xyz" %}
        {action_raise_error("Home XYZ before a tool change.")}
    {% endif %}
    {% if "filament_switch_sensor cx_tool_sensor" not in printer %}
        {action_raise_error("Configure and verify cx_tool_sensor before commissioning.")}
    {% endif %}
    {% if cfg.z_hop <= 0 or cfg.travel_speed <= 0 or cfg.dock_speed <= 0 or cfg.z_speed <= 0 or cfg.accel <= 0 or cfg.settle_ms < 100 %}
        {action_raise_error("Use positive movement settings, positive Z clearance and at least 100 ms sensor settling.")}
    {% endif %}
    {% if cfg.dock_shift_x == 0 or cfg.dock_dodge_y <= 0 or cfg.dock_safe_y <= cfg.dock_dodge_y %}
        {action_raise_error("Invalid front-dock movement geometry.")}
    {% endif %}
    {% for tool in range(6) %}
        {% set heater = "extruder" if tool == 0 else "extruder" ~ tool %}
        {% if heater not in printer %}
            {action_raise_error("Missing heater/extruder configuration: " ~ heater)}
        {% endif %}
        {% if printer.configfile.settings[heater].min_extrude_temp|default(170)|float < 180 %}
            {action_raise_error("Set min_extrude_temp to at least 180 for " ~ heater)}
        {% endif %}
        {% if tool not in cfg.docks or cfg.docks[tool]|length != 2 %}
            {action_raise_error("Missing dock coordinates for T" ~ tool)}
        {% endif %}
        {% set dock = cfg.docks[tool] %}
        {% if dock[0] is not number or dock[1] is not number %}
            {action_raise_error("Measure both dock coordinates for T" ~ tool)}
        {% endif %}
        {% for x in [dock[0], dock[0] + cfg.dock_shift_x] %}
            {% if x < printer.toolhead.axis_minimum.x or x > printer.toolhead.axis_maximum.x %}
                {action_raise_error("T" ~ tool ~ " dock X path exceeds travel limits.")}
            {% endif %}
        {% endfor %}
        {% for y in [dock[1], dock[1] + cfg.dock_dodge_y, dock[1] + cfg.dock_safe_y] %}
            {% if y < printer.toolhead.axis_minimum.y or y > printer.toolhead.axis_maximum.y %}
                {action_raise_error("T" ~ tool ~ " dock Y path exceeds travel limits.")}
            {% endif %}
        {% endfor %}
    {% endfor %}

[gcode_macro CX_CONFIRM_TOOL]
description: Reconcile physical tool identity after boot or after canceling a fault
gcode:
    {% if params.TOOL|default("")|string not in ["-1", "0", "1", "2", "3", "4", "5"] %}
        {action_raise_error("Specify the physically observed TOOL=-1 or TOOL=0..5.")}
    {% endif %}
    {% if printer.pause_resume.is_paused %}
        {action_raise_error("CANCEL_PRINT before reconciling a tool fault; restart the job after recovery.")}
    {% endif %}
    M400
    G4 P{printer["gcode_macro _CX_CONFIG"].settle_ms}
    _CX_CONFIRM TOOL={params.TOOL}

[gcode_macro _CX_CONFIRM]
gcode:
    {% set tool = params.TOOL|int %}
    {% set loaded = printer["filament_switch_sensor cx_tool_sensor"].filament_detected %}
    {% if loaded != (tool >= 0) %}
        {action_raise_error("Tool declaration disagrees with cx_tool_sensor. Inspect the mechanism, filament and switch polarity.")}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_CX_STATE VARIABLE=current_tool VALUE={tool}
    SET_GCODE_VARIABLE MACRO=_CX_STATE VARIABLE=faulted VALUE=False
    SET_GCODE_VARIABLE MACRO=_CX_STATE VARIABLE=busy VALUE=False
    {% set svv = printer.save_variables.variables %}
    {% set off = namespace(values=[]) %}
    {% for axis in ["x", "y", "z"] %}
        {% set value = svv["t" ~ tool ~ "_offset_" ~ axis]|default(0.0)|float if tool >= 0 else 0.0 %}
        {% set off.values = off.values + [value] %}
    {% endfor %}
    SET_GCODE_OFFSET X={off.values[0]} Y={off.values[1]} Z={off.values[2]} MOVE=0
    SET_GCODE_VARIABLE MACRO=_CX_STATE VARIABLE=applied_tool_offset VALUE="{off.values}"
    {% if tool >= 0 %}
        {% set heater = "extruder" if tool == 0 else "extruder" ~ tool %}
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE={heater}
        ACTIVATE_EXTRUDER EXTRUDER={heater}
        SET_FILAMENT_SENSOR SENSOR=cx_tool_sensor ENABLE=1
    {% else %}
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=
        SET_FILAMENT_SENSOR SENSOR=cx_tool_sensor ENABLE=0
    {% endif %}

[gcode_macro T0]
gcode: CX_CHANGE_TOOL TOOL=0
[gcode_macro T1]
gcode: CX_CHANGE_TOOL TOOL=1
[gcode_macro T2]
gcode: CX_CHANGE_TOOL TOOL=2
[gcode_macro T3]
gcode: CX_CHANGE_TOOL TOOL=3
[gcode_macro T4]
gcode: CX_CHANGE_TOOL TOOL=4
[gcode_macro T5]
gcode: CX_CHANGE_TOOL TOOL=5
[gcode_macro UNTOOL]
gcode: CX_CHANGE_TOOL TOOL=-1 RETURN=0

[gcode_macro CX_CHANGE_TOOL]
description: Select TOOL=0..5 or -1; RETURN=0 is for docking/calibration in machine coordinates
gcode:
    {% if params.TOOL|default("")|string not in ["-1", "0", "1", "2", "3", "4", "5"] %}
        {action_raise_error("TOOL must be -1 or 0..5.")}
    {% endif %}
    {% if params.RETURN|default("1")|string not in ["0", "1"] %}
        {action_raise_error("RETURN must be 0 or 1.")}
    {% endif %}
    CX_ASSERT_READY
    M400
    G4 P{printer["gcode_macro _CX_CONFIG"].settle_ms}
    _CX_CHECK_CURRENT_TOOL
    _CX_WAIT_FOR_TOOL TOOL={params.TOOL}
    _CX_BEGIN TOOL={params.TOOL} RETURN={params.RETURN|default(1)}

[gcode_macro _CX_CHECK_CURRENT_TOOL]
gcode:
    {% set tool = printer["gcode_macro _CX_STATE"].current_tool|int %}
    {% if printer["filament_switch_sensor cx_tool_sensor"].filament_detected != (tool >= 0) %}
        _CX_FAIL REASON="Mounted-tool sensor disagrees with the confirmed state."
    {% endif %}

[gcode_macro _CX_WAIT_FOR_TOOL]
gcode:
    {% set tool = params.TOOL|int %}
    {% if tool >= 0 %}
        {% set heater = "extruder" if tool == 0 else "extruder" ~ tool %}
        {% set target = printer[heater].target|float %}
        {% if target > 0 %}
            M109 T{tool} S{target}
        {% endif %}
    {% endif %}

[gcode_macro _CX_BEGIN]
gcode:
    {% set tool = params.TOOL|int %}
    {% set state = printer["gcode_macro _CX_STATE"] %}
    {% set old = state.current_tool|int %}
    {% set cfg = printer["gcode_macro _CX_CONFIG"] %}
    {% set svv = printer.save_variables.variables %}
    {% set ret = params.RETURN|int == 1 and tool >= 0 %}
    {% set pos = printer.gcode_move.position %}
    {% set gpos = printer.gcode_move.gcode_position %}
    {% set origin = printer.gcode_move.homing_origin %}
    {% set ns = namespace(offset=[], tool_offset=[], target=[]) %}
    {% for axis in range(3) %}
        {% set suffix = ["x", "y", "z"][axis] %}
        {% set key = "t" ~ tool ~ "_offset_" ~ suffix %}
        {% if ret and tool > 0 and key not in svv %}
            {action_raise_error("Calibrate T" ~ tool ~ " before a printing tool change; missing " ~ key)}
        {% endif %}
        {% set old_offset = state.applied_tool_offset[axis] %}
        {% set new_offset = svv[key]|default(0.0)|float if tool >= 0 else 0.0 %}
        {% set total = origin[axis] + new_offset - old_offset if ret else 0.0 %}
        {% set target = pos[axis] + total - origin[axis] if ret else pos[axis] %}
        {% if ret and (target < printer.toolhead.axis_minimum[axis] or target > printer.toolhead.axis_maximum[axis]) %}
            {action_raise_error("Compensated return position exceeds " ~ suffix|upper ~ " travel.")}
        {% endif %}
        {% set ns.offset = ns.offset + [total] %}
        {% set ns.tool_offset = ns.tool_offset + [new_offset if ret else 0.0] %}
        {% set ns.target = ns.target + [target] %}
    {% endfor %}
    {% if old == tool %}
        {% if tool >= 0 %}
            {% set heater = "extruder" if tool == 0 else "extruder" ~ tool %}
            SAVE_GCODE_STATE NAME=CX_SAME_TOOL
            SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE={heater}
            ACTIVATE_EXTRUDER EXTRUDER={heater}
            RESTORE_GCODE_STATE NAME=CX_SAME_TOOL MOVE=0
        {% else %}
            SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=
        {% endif %}
        {% if ret %}
            SET_GCODE_OFFSET X={ns.offset[0]} Y={ns.offset[1]} Z={ns.offset[2]} MOVE=0
        {% else %}
            SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
            G92 X{pos.x} Y{pos.y} Z{pos.z}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_CX_STATE VARIABLE=applied_tool_offset VALUE="{ns.tool_offset}"
        SET_FILAMENT_SENSOR SENSOR=cx_tool_sensor ENABLE={1 if tool >= 0 else 0}
    {% else %}
        {% set clearance = [pos.z, ns.target[2]]|max + cfg.z_hop %}
        {% if clearance > printer.toolhead.axis_maximum.z %}
            {action_raise_error("Insufficient Z clearance for the configured tool-change lift. Leave the tool mounted and recover manually.")}
        {% endif %}
        SAVE_GCODE_STATE NAME=CX_CHANGE
        SET_GCODE_VARIABLE MACRO=_CX_STATE VARIABLE=busy VALUE=True
        SET_GCODE_VARIABLE MACRO=_CX_STATE VARIABLE=current_tool VALUE=-2
        SET_GCODE_VARIABLE MACRO=_CX_STATE VARIABLE=saved_accel VALUE={printer.toolhead.max_accel}
        SET_GCODE_VARIABLE MACRO=_CX_STATE VARIABLE=return_enabled VALUE={ret}
        SET_GCODE_VARIABLE MACRO=_CX_STATE VARIABLE=return_position VALUE="{[gpos.x, gpos.y, gpos.z]}"
        SET_GCODE_VARIABLE MACRO=_CX_STATE VARIABLE=new_offset VALUE="{ns.offset}"
        SET_GCODE_VARIABLE MACRO=_CX_STATE VARIABLE=new_tool_offset VALUE="{ns.tool_offset}"
        SET_FILAMENT_SENSOR SENSOR=cx_tool_sensor ENABLE=0
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=
        SET_VELOCITY_LIMIT ACCEL={cfg.accel}
        G90
        SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
        G92 X{pos.x} Y{pos.y} Z{pos.z}
        G1 Z{clearance} F{cfg.z_speed * 60}
        {% if old >= 0 %}
            _CX_RELEASE TOOL={old}
        {% endif %}
        M400
        G4 P{cfg.settle_ms}
        _CX_AFTER_RELEASE TOOL={tool}
    {% endif %}

[gcode_macro _CX_RELEASE]
gcode:
    {% set cfg = printer["gcode_macro _CX_CONFIG"] %}
    {% set x, y = cfg.docks[params.TOOL|int] %}
    G1 X{x} Y{y + cfg.dock_safe_y} F{cfg.travel_speed * 60}
    G1 X{x} Y{y} F{cfg.dock_speed * 60}
    G1 X{x + cfg.dock_shift_x} Y{y} F{cfg.dock_speed * 60}
    G1 X{x + cfg.dock_shift_x} Y{y + cfg.dock_dodge_y} F{cfg.dock_speed * 60}
    G1 X{x} Y{y + cfg.dock_dodge_y} F{cfg.dock_speed * 60}
    G1 X{x} Y{y + cfg.dock_safe_y} F{cfg.travel_speed * 60}

[gcode_macro _CX_AFTER_RELEASE]
gcode:
    {% if printer["filament_switch_sensor cx_tool_sensor"].filament_detected %}
        _CX_FAIL REASON="Tool release did not clear the sensor; pickup was not attempted."
    {% elif params.TOOL|int >= 0 %}
        _CX_PICKUP TOOL={params.TOOL}
    {% else %}
        _CX_FINISH TOOL=-1
    {% endif %}

[gcode_macro _CX_PICKUP]
gcode:
    {% set cfg = printer["gcode_macro _CX_CONFIG"] %}
    {% set x, y = cfg.docks[params.TOOL|int] %}
    G1 X{x} Y{y + cfg.dock_safe_y} F{cfg.travel_speed * 60}
    G1 X{x} Y{y + cfg.dock_dodge_y} F{cfg.travel_speed * 60}
    G1 X{x + cfg.dock_shift_x} Y{y + cfg.dock_dodge_y} F{cfg.dock_speed * 60}
    G1 X{x + cfg.dock_shift_x} Y{y} F{cfg.dock_speed * 60}
    G1 X{x} Y{y} F{cfg.dock_speed * 60}
    G1 X{x} Y{y + cfg.dock_safe_y} F{cfg.travel_speed * 60}
    M400
    G4 P{cfg.settle_ms}
    _CX_VERIFY_PICKUP TOOL={params.TOOL}

[gcode_macro _CX_VERIFY_PICKUP]
gcode:
    {% if not printer["filament_switch_sensor cx_tool_sensor"].filament_detected %}
        _CX_FAIL REASON="Pickup failed or the new tool has no filament. Cancel, inspect and reconcile before restarting."
    {% else %}
        _CX_FINISH TOOL={params.TOOL}
    {% endif %}

[gcode_macro _CX_FINISH]
gcode:
    {% set tool = params.TOOL|int %}
    {% set state = printer["gcode_macro _CX_STATE"] %}
    {% set cfg = printer["gcode_macro _CX_CONFIG"] %}
    {% set off = state.new_offset %}
    {% set pos = printer.gcode_move.position %}
    {% if tool >= 0 %}
        {% set heater = "extruder" if tool == 0 else "extruder" ~ tool %}
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE={heater}
        ACTIVATE_EXTRUDER EXTRUDER={heater}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_CX_STATE VARIABLE=current_tool VALUE={tool}
    RESTORE_GCODE_STATE NAME=CX_CHANGE MOVE=0
    {% if state.return_enabled %}
        SET_GCODE_OFFSET X={off[0]} Y={off[1]} Z={off[2]} MOVE=0
        G90
        G1 X{state.return_position[0]} Y{state.return_position[1]} F{cfg.travel_speed * 60}
        G1 Z{state.return_position[2]} F{cfg.z_speed * 60}
        RESTORE_GCODE_STATE NAME=CX_CHANGE MOVE=0
        SET_GCODE_OFFSET X={off[0]} Y={off[1]} Z={off[2]} MOVE=0
    {% else %}
        SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
        G92 X{pos.x} Y{pos.y} Z{pos.z}
    {% endif %}
    SET_VELOCITY_LIMIT ACCEL={state.saved_accel}
    M400
    SET_GCODE_VARIABLE MACRO=_CX_STATE VARIABLE=applied_tool_offset VALUE="{state.new_tool_offset}"
    SET_FILAMENT_SENSOR SENSOR=cx_tool_sensor ENABLE={1 if tool >= 0 else 0}
    SET_GCODE_VARIABLE MACRO=_CX_STATE VARIABLE=busy VALUE=False

[gcode_macro _CX_FAIL]
gcode:
    {% set state = printer["gcode_macro _CX_STATE"] %}
    TURN_OFF_HEATERS
    SET_FILAMENT_SENSOR SENSOR=cx_tool_sensor ENABLE=0
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=
    {% if state.busy %}
        RESTORE_GCODE_STATE NAME=CX_CHANGE MOVE=0
        SET_VELOCITY_LIMIT ACCEL={state.saved_accel}
    {% endif %}
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
    SET_GCODE_VARIABLE MACRO=_CX_STATE VARIABLE=current_tool VALUE=-2
    SET_GCODE_VARIABLE MACRO=_CX_STATE VARIABLE=faulted VALUE=True
    SET_GCODE_VARIABLE MACRO=_CX_STATE VARIABLE=busy VALUE=False
    SET_GCODE_VARIABLE MACRO=_CX_STATE VARIABLE=applied_tool_offset VALUE="{[0.0, 0.0, 0.0]}"
    PAUSE
    _CX_RAISE REASON="{params.REASON}"

[gcode_macro _CX_RAISE]
gcode:
    {action_raise_error(params.REASON)}

# The active virtual extruder has no stepper for T1..T5. Route slicer pressure
# advance to the one physical motor, including when no EXTRUDER is specified.
[gcode_macro SET_PRESSURE_ADVANCE]
rename_existing: BASE_CX_SET_PRESSURE_ADVANCE
gcode:
    {% if params.EXTRUDER|default("extruder") != "extruder" %}
        {action_raise_error("The shared CxChanger stepper is EXTRUDER=extruder.")}
    {% endif %}
    {% set args = namespace(text="") %}
    {% for key, value in params.items() %}
        {% if key != "EXTRUDER" %}
            {% set args.text = args.text ~ " " ~ key ~ "=" ~ value %}
        {% endif %}
    {% endfor %}
    BASE_CX_SET_PRESSURE_ADVANCE EXTRUDER=extruder{args.text}
