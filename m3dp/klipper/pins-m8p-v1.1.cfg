# Select this file ONLY after confirming a Manta M8P V1.1 board marking.
# Do not include the V2.0 profile at the same time. Main MCU must be named mcu.
# Source: BTT Manta-M8P V1.0_V1.1/Firmware/Klipper/
# generic-bigtreetech-manta-m8p-V1_1.cfg (HE0/TH0 through HE3/TH3).
[board_pins cx_m8p_v11]
mcu: mcu
aliases:
    CX_T0_HEATER=PE3, CX_T0_SENSOR=PA1,
    CX_T1_HEATER=PB5, CX_T1_SENSOR=PA2,
    CX_T2_HEATER=PB6, CX_T2_SENSOR=PA3,
    CX_T3_HEATER=PE1, CX_T3_SENSOR=PA4
