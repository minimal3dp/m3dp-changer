# Optional XYZ nozzle-contact calibration macros.
# These do not configure a bed probe or turn an ordinary BTT Eddy into an XYZ probe.
# Install/configure the tools_calibrate extension and a real fixture before enabling.

[gcode_macro _CX_CALIB_CONFIG]
variable_enabled: False
# Machine coordinates with T0 about 1 mm above the fixture; no guessed positions.
variable_approach: [None, None, None]
# A measured, unobstructed Z plane above the fixture and all approach obstacles.
variable_clearance_z: None
gcode:

[gcode_macro _CX_CALIB_STATE]
variable_reference_valid: False
gcode:

[gcode_macro CALIBRATE_TOOL]
description: Calibrate TOOL=0..5 against the configured nozzle-contact fixture
gcode:
    {% set raw = params.TOOL|default('')|string %}
    {% if raw not in ['0', '1', '2', '3', '4', '5'] %}
        {action_raise_error("Specify TOOL=0 through 5")}
    {% endif %}
    {% set tool = raw|int %}
    {% set cfg = printer['gcode_macro _CX_CALIB_CONFIG'] %}
    {% if not cfg.enabled or 'tools_calibrate' not in printer %}
        {action_raise_error("Configure a nozzle-contact fixture and tools_calibrate before enabling calibration")}
    {% endif %}
    {% if cfg.clearance_z is not number or cfg.approach|length != 3 %}
        {action_raise_error("Measure the calibration approach and clearance before enabling")}
    {% endif %}
    {% for axis in range(3) %}
        {% if cfg.approach[axis] is not number %}
            {action_raise_error("Calibration approach coordinates are unset")}
        {% endif %}
        {% if cfg.approach[axis] < printer.toolhead.axis_minimum[axis]
              or cfg.approach[axis] > printer.toolhead.axis_maximum[axis] %}
            {action_raise_error("Calibration approach exceeds travel limits")}
        {% endif %}
    {% endfor %}
    {% if cfg.clearance_z <= cfg.approach[2] or cfg.clearance_z > printer.toolhead.axis_maximum.z %}
        {action_raise_error("Calibration clearance must be above the fixture approach and within Z travel")}
    {% endif %}
    {% if tool > 0 and not printer['gcode_macro _CX_CALIB_STATE'].reference_valid %}
        {action_raise_error("Calibrate T0 in this session before T1 through T5")}
    {% endif %}
    CX_ASSERT_READY
    {% if tool == 0 %}
        SET_GCODE_VARIABLE MACRO=_CX_CALIB_STATE VARIABLE=reference_valid VALUE=False
    {% endif %}
    CX_CHANGE_TOOL TOOL={tool} RETURN=0
    _CX_CALIB_APPROACH
    {% if tool == 0 %}
        TOOL_LOCATE_SENSOR
    {% else %}
        TOOL_CALIBRATE_TOOL_OFFSET
    {% endif %}
    M400
    _CX_SAVE_CALIBRATION TOOL={tool}
    _CX_CALIB_LIFT
    UNTOOL

[gcode_macro _CX_CALIB_APPROACH]
gcode:
    {% set cfg = printer['gcode_macro _CX_CALIB_CONFIG'] %}
    {% set clearance = [cfg.clearance_z, printer.gcode_move.position.z]|max %}
    G90
    G1 Z{clearance} F600
    G1 X{cfg.approach[0]} Y{cfg.approach[1]} F3000
    G1 Z{cfg.approach[2]} F300

[gcode_macro _CX_CALIB_LIFT]
gcode:
    {% set cfg = printer['gcode_macro _CX_CALIB_CONFIG'] %}
    G90
    G1 Z{[cfg.clearance_z, printer.gcode_move.position.z]|max} F600

[gcode_macro _CX_SAVE_CALIBRATION]
gcode:
    {% set tool = params.TOOL|int %}
    {% set result = [0.0, 0.0, 0.0] if tool == 0 else printer.tools_calibrate.last_result %}
    {% for axis in range(3) %}
        {% if result[axis] is not number or result[axis] != result[axis]
              or result[axis]|abs > printer.toolhead.axis_maximum[axis] - printer.toolhead.axis_minimum[axis] %}
            {action_raise_error("Invalid nozzle calibration result; no offsets saved")}
        {% endif %}
    {% endfor %}
    {% for axis in range(3) %}
        SAVE_VARIABLE VARIABLE=t{tool}_offset_{['x', 'y', 'z'][axis]} VALUE={result[axis]|round(6)}
    {% endfor %}
    {% if tool == 0 %}
        SET_GCODE_VARIABLE MACRO=_CX_CALIB_STATE VARIABLE=reference_valid VALUE=True
    {% endif %}

[gcode_macro CALIBRATE_ALL_TOOLS]
gcode:
    {% for tool in range(6) %}
        CALIBRATE_TOOL TOOL={tool}
    {% endfor %}
